<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قراءة نص من صورة بدون API</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      max-width: 700px;
      margin: auto;
    }

    button {
      padding: 10px 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
    }

    .box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      background: #fafafa;
    }

    .progress {
      margin-top: 10px;
      color: #555;
    }

    ul {
      padding-right: 20px;
    }

    li {
      margin-bottom: 8px;
      background: white;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #eee;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h2>قراءة نص من صورة بدون API</h2>

  <input
    id="imageInput"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <br>

  <button id="readButton">اقرأ الصورة</button>
  <button id="saveButton" disabled>حفظ النتيجة</button>

  <div id="progress" class="progress"></div>

  <textarea
    id="resultText"
    rows="6"
    placeholder="النص المستخرج سيظهر هنا"
  ></textarea>

  <div class="box">
    <h3>النتائج المحفوظة</h3>
    <ul id="savedResults"></ul>
  </div>

  <!-- مكتبة Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const imageInput = document.getElementById('imageInput');
    const readButton = document.getElementById('readButton');
    const saveButton = document.getElementById('saveButton');
    const progress = document.getElementById('progress');
    const resultText = document.getElementById('resultText');
    const savedResults = document.getElementById('savedResults');

    let currentText = '';

    // قراءة النتائج المحفوظة من localStorage
    function getSavedResults() {
      try {
        return JSON.parse(localStorage.getItem('ocr_results') || '[]');
      } catch {
        return [];
      }
    }

    // حفظ كل النتائج داخل localStorage
    function setSavedResults(items) {
      localStorage.setItem('ocr_results', JSON.stringify(items));
    }

    // عرض النتائج المحفوظة
    function renderSavedResults() {
      const items = getSavedResults();
      savedResults.innerHTML = '';

      if (items.length === 0) {
        savedResults.innerHTML = '<li>لا توجد نتائج محفوظة بعد</li>';
        return;
      }

      items.forEach(item => {
        const li = document.createElement('li');

        const date = new Date(item.date).toLocaleString('ar');

        li.textContent = `
[${date}]
${item.text}
        `.trim();

        savedResults.appendChild(li);
      });
    }

    renderSavedResults();

    // قراءة الصورة
    readButton.addEventListener('click', async () => {
      const file = imageInput.files[0];

      if (!file) {
        alert('اختر صورة أولًا');
        return;
      }

      currentText = '';
      resultText.value = '';
      saveButton.disabled = true;

      progress.textContent = 'جاري تجهيز محرك القراءة...';

      try {
        // إنشاء worker لقراءة العربية والإنجليزية
        const worker = await Tesseract.createWorker('ara+eng', 1, {
          logger: info => {
            if (info.status === 'recognizing text') {
              const percent = Math.round(info.progress * 100);
              progress.textContent = `جاري قراءة النص: ${percent}%`;
            }
          }
        });

        const { data } = await worker.recognize(file);

        await worker.terminate();

        currentText = data.text || '';

        resultText.value = currentText;

        if (currentText.trim()) {
          progress.textContent = 'تمت القراءة بنجاح';
          saveButton.disabled = false;
        } else {
          progress.textContent = 'لم يتم العثور على نص داخل الصورة';
        }

      } catch (error) {
        console.error(error);
        progress.textContent = 'حدث خطأ أثناء قراءة الصورة';
      }
    });

    // حفظ النتيجة
    saveButton.addEventListener('click', () => {
      if (!currentText.trim()) {
        alert('لا يوجد نص لحفظه');
        return;
      }

      const items = getSavedResults();

      items.unshift({
        id: Date.now(),
        date: new Date().toISOString(),
        text: currentText.trim()
      });

      setSavedResults(items);
      renderSavedResults();

      alert('تم حفظ النتيجة');
    });
  </script>

</body>
</html>
