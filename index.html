  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ باركود PDF417</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        #video-container { position: relative; width: 100%; max-width: 500px; margin: auto; border: 4px solid #333; border-radius: 8px; overflow: hidden; background: #000; }
        video { width: 100%; height: auto; display: block; }
        #scanner-laser { position: absolute; top: 50%; left: 5%; width: 90%; height: 2px; background: red; box-shadow: 0 0 8px red; animation: laserMove 2s infinite ease-in-out; }
        @keyframes laserMove { 0%, 100% { top: 20%; } 50% { top: 80%; } }
        button { padding: 12px 24px; font-size: 16px; background: #28a745; color: #fff; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        #result-box { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ccc; border-radius: 5px; max-width: 500px; margin-left: auto; margin-right: auto; word-break: break-all; }
        #error-msg { color: white; background: red; padding: 10px; border-radius: 5px; margin-top: 10px; display: none; }
    </style>
    
    <!-- تحديث رابط المكتبة إلى سيرفر cndjs العالمي والأكثر استقراراً -->
    <script src="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

    <h2>ماسح باركود الهويات (PDF417)</h2>
    <p>قم بتوجيه الباركود نحو الكاميرا بعد تشغيلها</p>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="scanner-laser"></div>
    </div>

    <button id="start-btn">تشغيل الكاميرا والمسح</button>
    <div id="error-msg"></div>
    
    <div id="result-box">
        <strong>البيانات المستخرجة:</strong>
        <p id="result">في انتظار بدء المسح...</p>
    </div>

    <script>
        const videoElement = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const resultText = document.getElementById('result');
        const errorMsg = document.getElementById('error-msg');
        let isScanning = false;
        let codeReader = null;

        startBtn.addEventListener('click', async () => {
            if (isScanning) {
                if(codeReader) codeReader.reset();
                if(videoElement.srcObject) {
                    videoElement.srcObject.getTracks().forEach(track => track.stop());
                }
                resultText.innerText = "تم إيقاف المسح.";
                startBtn.innerText = "تشغيل الكاميرا والمسح";
                startBtn.style.background = "#28a745";
                isScanning = false;
                errorMsg.style.display = "none";
            } else {
                resultText.innerText = "جاري تهيئة الكاميرا وفحص المكتبة...";
                errorMsg.style.display = "none";

                // التحقق الفوري من أن المكتبة تم تحميلها بنجاح في المتصفح
                if (typeof ZXing === 'undefined') {
                    errorMsg.style.display = "block";
                    errorMsg.innerText = "فشل تحميل مكتبة قارئ الباركود من الإنترنت. يرجى تحديث الصفحة أو التحقق من اتصال الشبكة.";
                    return;
                }

                try {
                    // طلب تفعيل الكاميرا الخلفية أولاً للهواتف
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { ideal: "environment" } } 
                    }).catch(async () => {
                        // حل بديل في حال عدم وجود كاميرا خلفية (مثل لابتوب)
                        return await navigator.mediaDevices.getUserMedia({ video: true });
                    });

                    videoElement.srcObject = stream;

                    // تهيئة دقيقة للمكتبة لقراءة كود PDF417 المخصص للهويات
                    const hints = new Map();
                    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.PDF_417]);
                    codeReader = new ZXing.BrowserMultiFormatReader(hints);

                    codeReader.decodeFromStream(stream, videoElement, (result, err) => {
                        if (result) {
                            // إظهار النتيجة بنجاح عند فك تشفير الكود
                            resultText.innerHTML = `<span style="color:green; font-weight:bold; font-size: 18px;">${result.text}</span>`;
                            if (navigator.vibrate) navigator.vibrate(200); // اهتزاز للتنبيه
                        }
                    });

                    startBtn.innerText = "إيقاف الكاميرا";
                    startBtn.style.background = "#dc3545";
                    isScanning = true;
                    resultText.innerText = "وجه الكاميرا الآن بدقة وثبات نحو كود الـ PDF417...";

                } catch (error) {
                    console.error(error);
                    errorMsg.style.display = "block";
                    errorMsg.innerText = `حدث خطأ أثناء تشغيل الكاميرا: ${error.message}`;
                }
            }
        });
    </script>
</body>
</html>
