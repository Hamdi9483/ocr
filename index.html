<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ النصوص الذكي (OCR)</title>
    
    <!-- استدعاء مكتبة Tesseract.js لتشغيل الـ OCR في المتصفح -->
    <script src="https://jsdelivr.net"></script>

    <style>
        /* --- أسلوب التصميم (CSS) --- */
        :root {
            --primary-color: #1a73e8; /* لون جوجل لينز الأزرق */
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #3c4043;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 24px;
        }

        .upload-section {
            border: 2px dashed #dadce0;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #fafafa;
        }

        .upload-section:hover {
            border-color: var(--primary-color);
            background: #f1f3f4;
        }

        #fileInput {
            display: none;
        }

        .btn-capture {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-capture:hover {
            background-color: #1557b0;
        }

        #previewImage {
            max-width: 100%;
            max-height: 350px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* شريط التحميل Progress Bar */
        .status-container {
            margin-top: 25px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            background-color: #e8eaed;
            border-radius: 8px;
            overflow: hidden;
            height: 10px;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.1s linear;
        }

        #statusText {
            font-size: 14px;
            font-weight: 500;
            color: #5f6368;
        }

        /* صندوق النتيجة */
        .result-section {
            margin-top: 30px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            resize: vertical;
            font-size: 15px;
            line-height: 1.6;
            box-sizing: border-box;
            background: #fafafa;
        }

        .btn-copy {
            background: #34a853;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 500;
        }
        .btn-copy:hover { background: #2b8a44; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔍 قارئ النصوص الذكي (OCR)</h1>
        
        <!-- منطقة رفع الصورة -->
        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <p>اضغط هنا لرفع صورة أو فتح الكاميرا لنسخ النص</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <center>
            <!-- للموبايل سيتيح هذا الخيار فتح الكاميرا مباشرة -->
            <button class="btn-capture" onclick="document.getElementById('fileInput').click()">📸 التقاط صورة</button>
        </center>

        <!-- عرض الصورة المرفوعة للـتأكيد -->
        <center><img id="previewImage" alt="معاينة المستند"></center>

        <!-- مؤشرات عملية المعالجة وقراءة النص -->
        <div class="status-container" id="statusContainer">
            <div id="statusText">جاري تهيئة المحرك الذكي...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- صندوق استخراج النص -->
        <div class="result-section">
            <label for="resultText">النص المستخرج:</label>
            <textarea id="resultText" placeholder="سيظهر النص المستخرج هنا... يمكنك تعديله أو نسخه مباشرة."></textarea>
            <button class="btn-copy" id="copyBtn" onclick="copyText()">📋 نسخ النص</button>
        </div>
    </div>

    <script>
        /* --- منطق العمل والذكاء الاصطناعي (JavaScript) --- */
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const progressFill = document.getElementById('progressFill');
        const resultText = document.getElementById('resultText');

        // استماع لحدث تغيير الملف (عند رفع صورة أو التقاطها)
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // عرض الصورة للمستخدم
            const reader = new FileReader();
            reader.onload = function(event) {
                previewImage.src = event.target.result;
                previewImage.style.display = 'block';
                
                // بدء عملية قراءة النص من الصورة
                processImage(event.target.result);
            }
            reader.readAsDataURL(file);
        });

        // دالة معالجة الصورة واستخراج النصوص
        async function processImage(imageSrc) {
            // إظهار شريط التحميل وتصفير النتيجة السابقة
            statusContainer.style.display = 'block';
            resultText.value = '';
            progressFill.style.width = '0%';

            try {
                // ملاحظة: قمنا بتمرير اللغتين 'ara' (العربية) و 'eng' (الإنجليزية) معاً ليعمل مثل جوجل لينز في قراءة النصوص المختلطة
                const worker = await Tesseract.createWorker(['ara', 'eng']);
                
                // متابعة تقدم العملية لتحديث شريط التحميل (Progress)
                worker.logger = (m) => {
                    if (m.status === 'recognizing text') {
                        const progressPercentage = Math.round(m.progress * 100);
                        statusText.innerText = `جاري قراءة وتحليل النص... (${progressPercentage}%)`;
                        progressFill.style.width = `${progressPercentage}%`;
                    } else {
                        statusText.innerText = 'تحضير أدوات المعالجة الحيوية...';
                    }
                };

                // تنفيذ عملية الـ OCR
                const { data: { text } } = await worker.recognize(imageSrc);
                
                // إنهاء عمل الـ Worker لتحرير ذاكرة المتصفح والمحافظة على السرعة
                await worker.terminate();

                // عرض النتيجة النهائية للمستخدم
                if(text.trim() === "") {
                    resultText.value = "لم يتم العثور على نصوص واضحة في هذه الصورة. تأكد من جودة الإضاءة والخط.";
                } else {
                    resultText.value = text;
                }
                statusText.innerText = '✅ تمت المعالجة بنجاح!';
                
            } catch (error) {
                console.error(error);
                statusText.innerText = '❌ عذراً، حدث خطأ أثناء معالجة الصورة.';
                alert('فشلت قراءة الصورة، يرجى المحاولة مرة أخرى بصورة أكثر وضوحاً.');
            }
        }

        // دالة مساعدة لنسخ النص بضغطة زر
        function copyText() {
            if(!resultText.value) return;
            resultText.select();
            document.execCommand('copy');
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = '✔ تم النسخ!';
            setTimeout(() => { copyBtn.innerText = '📋 نسخ النص'; }, 2000);
        }
    </script>
</body>
</html>
