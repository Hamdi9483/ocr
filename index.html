<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح PDF417 – حل نهائي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #16213e;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }
        h1 { text-align: center; color: #e94560; margin-bottom: 10px; }
        .browser-note {
            background: #2a2a4a;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .video-box {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }
        .scan-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #e94560;
            width: 80%; height: 40%;
            border-radius: 10px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(233,69,96,0.6);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        button, .btn {
            background: #0f3460;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            flex: 1 1 auto;
            font-size: 1rem;
            text-align: center;
            transition: background 0.2s;
        }
        button:hover, .btn:hover { background: #e94560; }
        #stopBtn, #snapBtn { display: none; }
        #fileInput { display: none; }
        .result-box {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            word-break: break-all;
            font-family: monospace;
            text-align: center;
            min-height: 50px;
            margin-bottom: 5px;
        }
        .status { font-size: 0.85rem; color: #aaa; text-align: center; margin-bottom: 15px; }
        .mirror-btn {
            background: #533483;
            font-size: 0.9rem;
            padding: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📷 ماسح PDF417</h1>
    <div class="browser-note" id="browserNote">
        يعمل على Chrome أو Edge مع HTTPS/localhost
    </div>

    <div class="video-box">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-frame"></div>
    </div>

    <div class="controls">
        <button id="startBtn">▶️ بدء الكاميرا</button>
        <button id="snapBtn">📸 التقط وحلل</button>
        <button id="stopBtn">⏹️ إيقاف</button>
        <button id="mirrorBtn" class="mirror-btn">🔄 اعكس الصورة</button>
        <label for="fileInput" class="btn">📁 رفع صورة</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="result-box" id="result">لم يتم الاكتشاف بعد</div>
    <div class="status" id="status">جاهز</div>
</div>
<canvas id="canvas" hidden></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('startBtn');
    const snapBtn = document.getElementById('snapBtn');
    const stopBtn = document.getElementById('stopBtn');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const fileInput = document.getElementById('fileInput');
    const resultDiv = document.getElementById('result');
    const statusDiv = document.getElementById('status');

    let stream = null;
    let mirrored = false; // لتتبع حالة الانعكاس

    // التحقق من دعم BarcodeDetector
    if (!('BarcodeDetector' in window)) {
        document.getElementById('browserNote').innerHTML = 
            '⚠️ متصفحك لا يدعم BarcodeDetector. استخدم Chrome أو Edge على جهاز حقيقي.';
    }

    // دالة المسح باستخدام BarcodeDetector
    async function scanImage(imageSource) {
        try {
            const formats = ['pdf417']; // نبحث عن PDF417 فقط
            // يمكن إضافة أنواع أخرى: ['qr_code', 'ean_13', ...]
            const detector = new BarcodeDetector({ formats });
            const barcodes = await detector.detect(imageSource);
            if (barcodes.length > 0) {
                return barcodes[0].rawValue;
            }
            return null;
        } catch (err) {
            console.error('خطأ في BarcodeDetector:', err);
            return null;
        }
    }

    // بدء الكاميرا
    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment', // كاميرا خلفية
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            video.srcObject = stream;
            await video.play();

            startBtn.style.display = 'none';
            snapBtn.style.display = 'inline-block';
            stopBtn.style.display = 'inline-block';
            statusDiv.textContent = 'الكاميرا جاهزة، وجّه الباركود واضغط "التقط وحلل"';
        } catch (err) {
            statusDiv.textContent = 'فشل فتح الكاميرا: ' + err.message;
            alert('تأكد من السماح للكاميرا وأنك تستخدم HTTPS/localhost.');
        }
    }

    // إيقاف الكاميرا
    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        video.srcObject = null;
        startBtn.style.display = 'inline-block';
        snapBtn.style.display = 'none';
        stopBtn.style.display = 'none';
        statusDiv.textContent = 'متوقف';
    }

    // عكس الصورة (للتبديل بين الكاميرا الأمامية/الخلفية إذا كانت معكوسة)
    function toggleMirror() {
        mirrored = !mirrored;
        video.style.transform = mirrored ? 'scaleX(-1)' : 'scaleX(1)';
        mirrorBtn.textContent = mirrored ? '🔃 إلغاء العكس' : '🔄 اعكس الصورة';
    }

    // التقاط إطار وتحليله
    async function captureAndDecode() {
        if (!stream || video.readyState < 2) {
            alert('الكاميرا غير جاهزة');
            return;
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        // إذا كانت الصورة معكوسة، اعكس الرسم
        if (mirrored) {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        statusDiv.textContent = 'جارٍ التحليل...';
        const result = await scanImage(canvas);
        if (result) {
            resultDiv.textContent = result;
            statusDiv.textContent = '✅ تم الاكتشاف!';
        } else {
            // محاولة بدون عكس الصورة (في حالة كان الانعكاس هو السبب)
            if (mirrored) {
                // إعادة الرسم بدون عكس
                ctx.setTransform(1, 0, 0, 1, 0, 0); // إعادة التعيين
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const result2 = await scanImage(canvas);
                if (result2) {
                    resultDiv.textContent = result2;
                    statusDiv.textContent = '✅ تم الاكتشاف (بدون عكس)!';
                    return;
                }
            }
            resultDiv.textContent = 'لم يتم العثور على PDF417. تأكد من وضوح الباركود وإضاءة جيدة.';
            statusDiv.textContent = 'فشل التحليل';
        }
    }

    // تحليل صورة مرفوعة
    async function handleFileUpload(file) {
        if (!file) return;
        statusDiv.textContent = 'جارٍ تحليل الصورة...';
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = async () => {
            const result = await scanImage(img);
            if (result) {
                resultDiv.textContent = result;
                statusDiv.textContent = '✅ تم الاكتشاف من الصورة!';
            } else {
                resultDiv.textContent = 'لم يتم العثور على PDF417 في الصورة.';
                statusDiv.textContent = 'فشل التحليل';
            }
        };
    }

    // الأحداث
    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    snapBtn.addEventListener('click', captureAndDecode);
    mirrorBtn.addEventListener('click', toggleMirror);
    fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) handleFileUpload(e.target.files[0]);
    });

    window.addEventListener('beforeunload', stopCamera);
</script>
</body>
    </html>
