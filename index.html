<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>الماسح الفوري | Live OCR عربي وإنجليزي</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f15;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }
    /* وضع الكاميرا ملء الشاشة */
    .scanner-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* سيتم التحكم في الانعكاس عبر الكود حسب الكاميرا */
    }
    canvas {
      display: none;
    }
    /* طبقة واجهة المستخدم */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 10;
    }
    .ui-overlay > * {
      pointer-events: auto;
    }
    /* شريط الحالة العلوي */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 10px 20px;
      margin: 0 5px;
      color: white;
      font-weight: 500;
    }
    .lang-selector {
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #ddd;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
    }
    .lang-btn.active {
      background: #38ef7d;
      color: #0a0f14;
      box-shadow: 0 0 18px rgba(56,239,125,0.5);
    }
    .switch-cam-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    /* إطار التركيز */
    .focus-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 100px;
      border: 2px dashed rgba(255,255,255,0.8);
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 5;
    }
    .focus-frame::after {
      content: "ضع النص هنا";
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.6);
      padding: 4px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }
    /* شريط النتيجة السفلي */
    .result-panel {
      background: rgba(10, 15, 22, 0.85);
      backdrop-filter: blur(25px);
      border-radius: 30px;
      padding: 18px 22px;
      margin: 0 10px 10px;
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      max-height: 140px;
      overflow-y: auto;
      transition: 0.3s;
    }
    .result-text {
      font-size: 1.1rem;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
      color: #f0f4f8;
      min-height: 28px;
    }
    .result-text:empty::after {
      content: "وجه الكاميرا نحو أي نص...";
      color: #6b7280;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
    }
    .btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      box-shadow: 0 8px 20px rgba(37,99,235,0.4);
    }
    .btn-live {
      background: #38ef7d;
      color: #0a0f14;
      font-weight: 700;
    }
    .btn-live.active {
      background: #ef4444;
      color: white;
    }
    .status-badge {
      font-size: 0.7rem;
      background: rgba(255,255,255,0.2);
      padding: 4px 12px;
      border-radius: 30px;
      margin-right: 10px;
    }
    @media (max-width: 500px) {
      .focus-frame {
        width: 240px;
        height: 80px;
      }
    }
  </style>
</head>
<body>
<div class="scanner-container" id="scannerContainer">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="preprocessCanvas"></canvas>
  <div class="focus-frame"></div>

  <div class="ui-overlay">
    <div class="top-bar">
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="ara+eng">ع+إنجليزي</button>
        <button class="lang-btn" data-lang="ara">عربي</button>
        <button class="lang-btn" data-lang="eng">إنجليزي</button>
      </div>
      <button class="switch-cam-btn" id="btnSwitchCam" title="تبديل الكاميرا">🔄</button>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-text" id="resultText"></div>
      <div class="action-buttons">
        <span class="status-badge" id="liveStatus">⏸️ متوقف</span>
        <button class="btn btn-live" id="btnToggleLive">🔴 بث مباشر</button>
        <button class="btn" id="btnCopy" style="display:none;">📋 نسخ</button>
        <button class="btn" id="btnSnapshot">📷 التقاط</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  (function() {
    // --- العناصر ---
    const video = document.getElementById('video');
    const preCanvas = document.getElementById('preprocessCanvas');
    const resultText = document.getElementById('resultText');
    const btnToggleLive = document.getElementById('btnToggleLive');
    const btnSwitchCam = document.getElementById('btnSwitchCam');
    const btnCopy = document.getElementById('btnCopy');
    const btnSnapshot = document.getElementById('btnSnapshot');
    const liveStatus = document.getElementById('liveStatus');
    const langBtns = document.querySelectorAll('.lang-btn');

    // --- الحالة ---
    let stream = null;
    let currentFacingMode = 'environment'; // خلفية
    let selectedLang = 'ara+eng';
    let ocrWorker = null;
    let liveMode = false;
    let liveInterval = null;
    let isProcessing = false;
    let lastRecognizedText = '';

    // --- إعداد اللغة ---
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedLang = btn.dataset.lang;
        initOCRWorker();
      });
    });

    async function initOCRWorker() {
      if (ocrWorker) {
        try { await ocrWorker.terminate(); } catch (e) {}
        ocrWorker = null;
      }
      setStatusText('⏳ تحميل بيانات اللغة...');
      try {
        ocrWorker = await Tesseract.createWorker(selectedLang, 1, {
          logger: m => {
            if (m.status === 'recognizing text' && liveMode) {
              // لا نحدّث الحالة في البث المباشر لتجنب الوميض
            }
          }
        });
        await ocrWorker.setParameters({
          tessedit_pageseg_mode: '6',
          preserve_interword_spaces: '1',
        });
        setStatusText('✅ جاهز');
      } catch (err) {
        console.error(err);
        setStatusText('❌ فشل التحميل');
        ocrWorker = null;
      }
    }

    // --- الكاميرا ---
    async function startCamera(facingMode = currentFacingMode) {
      stopCamera();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.style.display = 'block';
        currentFacingMode = facingMode;
        btnSwitchCam.disabled = false;
        await new Promise(resolve => video.onloadedmetadata = resolve);
        await video.play();
        setStatusText('📸 وجه الكاميرا نحو النص');
      } catch (err) {
        console.error(err);
        setStatusText('❌ تعذر فتح الكاميرا');
        stream = null;
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      video.style.display = 'none';
      btnSwitchCam.disabled = true;
      stopLiveMode();
    }

    function switchCamera() {
      const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCamera(newMode);
    }

    // --- معالجة الصورة مسبقاً (تحسين الدقة) ---
    function preprocessImage(imageDataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = preCanvas;
          const ctx = c.getContext('2d');
          // تصغير الصورة لتسريع المعالجة (عرض 800px كحد أقصى)
          let width = img.width;
          let height = img.height;
          const maxWidth = 800;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          c.width = width;
          c.height = height;
          // رسم الصورة
          ctx.drawImage(img, 0, 0, width, height);
          // الحصول على بيانات البكسل
          const imageData = ctx.getImageData(0, 0, width, height);
          const data = imageData.data;
          // تحويل إلى تدرج الرمادي وزيادة التباين
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];
            // تدرج الرمادي
            let gray = 0.299 * r + 0.587 * g + 0.114 * b;
            // زيادة التباين (simple contrast stretch)
            gray = (gray - 128) * 1.6 + 128;
            // قص القيم
            gray = Math.min(255, Math.max(0, gray));
            data[i] = data[i+1] = data[i+2] = gray;
          }
          ctx.putImageData(imageData, 0, 0);
          resolve(c.toDataURL('image/png'));
        };
        img.src = imageDataUrl;
      });
    }

    // --- دالة التعرف (تستخدم من الالتقاط ومن البث المباشر) ---
    async function recognizeImage(imageDataUrl) {
      if (!ocrWorker) {
        await initOCRWorker();
        if (!ocrWorker) return '';
      }
      try {
        const processed = await preprocessImage(imageDataUrl);
        const { data: { text } } = await ocrWorker.recognize(processed);
        return text.trim();
      } catch (e) {
        console.error('OCR error:', e);
        return '';
      }
    }

    // --- التقاط إطار من الفيديو ---
    function captureFrame() {
      if (!stream || video.readyState < 2) return null;
      const c = document.createElement('canvas');
      c.width = video.videoWidth;
      c.height = video.videoHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(video, 0, 0);
      return c.toDataURL('image/png');
    }

    // --- وضع البث المباشر (Live Scan) ---
    function startLiveMode() {
      if (!stream) {
        alert('يرجى تشغيل الكاميرا أولاً');
        return;
      }
      liveMode = true;
      btnToggleLive.textContent = '⏹️ إيقاف المباشر';
      btnToggleLive.classList.add('active');
      liveStatus.textContent = '🔴 مباشر';
      setStatusText('🔍 مسح مباشر...');
      // تشغيل التعرف كل 900 مللي ثانية
      if (liveInterval) clearInterval(liveInterval);
      liveInterval = setInterval(async () => {
        if (!liveMode || isProcessing) return;
        const frame = captureFrame();
        if (!frame) return;
        isProcessing = true;
        const text = await recognizeImage(frame);
        if (text && text !== lastRecognizedText) {
          lastRecognizedText = text;
          resultText.textContent = text;
          btnCopy.style.display = 'inline-block';
        }
        isProcessing = false;
      }, 900);
    }

    function stopLiveMode() {
      liveMode = false;
      if (liveInterval) {
        clearInterval(liveInterval);
        liveInterval = null;
      }
      btnToggleLive.textContent = '🔴 بث مباشر';
      btnToggleLive.classList.remove('active');
      liveStatus.textContent = '⏸️ متوقف';
      setStatusText('وضع الالتقاط اليدوي');
    }

    function toggleLiveMode() {
      if (liveMode) {
        stopLiveMode();
      } else {
        startLiveMode();
      }
    }

    // --- لقطة يدوية واحدة ---
    async function takeSnapshot() {
      if (!stream) {
        alert('شغّل الكاميرا أولاً');
        return;
      }
      setStatusText('📷 جاري المعالجة...');
      const frame = captureFrame();
      if (!frame) return;
      const text = await recognizeImage(frame);
      if (text) {
        resultText.textContent = text;
        lastRecognizedText = text;
        btnCopy.style.display = 'inline-block';
        setStatusText('✅ تم التعرف');
      } else {
        resultText.textContent = '';
        setStatusText('⚠️ لم يتم التعرف على نص');
      }
    }

    // --- نسخ النص ---
    function copyText() {
      const text = resultText.textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btnCopy.textContent;
        btnCopy.textContent = '✅ تم النسخ';
        setTimeout(() => { btnCopy.textContent = '📋 نسخ'; }, 2000);
      });
    }

    function setStatusText(msg) {
      // يمكن عرضها في مكان مخصص إن أردنا
      console.log('Status:', msg);
    }

    // --- دعم السحب والإفلات (للمرونة) ---
    document.body.addEventListener('dragover', e => e.preventDefault());
    document.body.addEventListener('drop', async e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const text = await recognizeImage(ev.target.result);
          if (text) {
            resultText.textContent = text;
            btnCopy.style.display = 'inline-block';
            setStatusText('✅ تم مسح الصورة المسحوبة');
          }
        };
        reader.readAsDataURL(file);
      }
    });

    // --- الأحداث ---
    btnToggleLive.addEventListener('click', toggleLiveMode);
    btnSnapshot.addEventListener('click', takeSnapshot);
    btnSwitchCam.addEventListener('click', switchCamera);
    btnCopy.addEventListener('click', copyText);

    // --- بدء التشغيل ---
    initOCRWorker().then(() => {
      startCamera(currentFacingMode);
    });

    // تنظيف
    window.addEventListener('beforeunload', () => {
      stopLiveMode();
      stopCamera();
      if (ocrWorker) ocrWorker.terminate();
    });

  })();
</script>
</body>
</html>
