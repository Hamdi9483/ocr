<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح باركود الهويات والمستندات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; padding: 15px; margin: 0; }
        h2 { color: #333; margin-bottom: 5px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-top: 15px; }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #0056b3; }
        #stop-btn { background: #dc3545; display: none; }
        #stop-btn:hover { background: #bd2130; }
        #result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; text-align: right; word-break: break-all; border-right: 5px solid #28a745; }
        #error-log { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 14px; text-align: center; display: none; }
    </style>
    
    <!-- استخدام سيرفر البديل المستقر والمدعوم عالمياً بدون حجب -->
    <script src="https://unpkg.com" type="text/javascript"></script>
</head>
<body>

<div class="container">
    <h2>قارئ باركود PDF417 السوري</h2>
    <p style="color: #666; font-size: 14px;">اضغط على تشغيل لتفعيل الكاميرا والمسح التلقائي</p>

    <!-- مكان عرض الكاميرا -->
    <div id="reader"></div>

    <button id="start-btn">تشغيل الكاميرا وبدء المسح</button>
    <button id="stop-btn">إيقاف الكاميرا</button>

    <div id="error-log"></div>

    <div id="result-box">
        <strong>البيانات المستخرجة للبطاقة:</strong>
        <p id="result-text" style="color: #333; font-family: monospace; margin-top: 8px;">في انتظار مسح الكود...</p>
    </div>
</div>

<script>
    let html5QrCode = null;
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const resultText = document.getElementById('result-text');
    const errorLog = document.getElementById('error-log');

    startBtn.addEventListener('click', async () => {
        errorLog.style.display = 'none';
        resultText.innerText = "جاري تشغيل الكاميرا...";

        // التأكد من تحميل المكتبة داخلياً
        if (typeof Html5Qrcode === 'undefined') {
            errorLog.style.display = 'block';
            errorLog.innerText = "خطأ: فشل اتصال المتصفح بمحرك فك التشفير. يرجى إعادة تحديث الصفحة.";
            return;
        }

        try {
            // تهيئة الماسح داخل العنصر المخصص
            html5QrCode = new Html5Qrcode("reader");

            // إعدادات المسح (تحديد صيغة PDF417 فقط لتسريع القراءة الفورية للهويات)
            const config = {
                fps: 15,
                qrbox: (width, height) => {
                    return { width: width * 0.8, height: height * 0.5 }; // مستطيل عريض مناسب لشكل الباركود في الهوية
                },
                formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ]
            };

            // تشغيل الكاميرا الخلفية تلقائياً وبدء المسح المباشر
            await html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                (decodedText, decodedResult) => {
                    // في حال النجاح في القراءة
                    resultText.innerHTML = `<span style="color:#28a745; font-weight:bold; font-size:16px;">${decodedText}</span>`;
                    if (navigator.vibrate) navigator.vibrate(200); // اهتزاز الهاتف تنبيهاً بالنجاح
                },
                (errorMessage) => {
                    // تجاهل أخطاء البحث عن الكود المستمرة أثناء حركة الكاميرا العادية
                }
            );

            // تبديل الأزرار عند نجاح فتح الكاميرا
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            resultText.innerText = "وجه الكاميرا الآن بشكل مستقيم ومستقر نحو الباركود الخلفي للهوية...";

        } catch (err) {
            console.error(err);
            errorLog.style.display = 'block';
            errorLog.innerText = `تعذر تشغيل الكاميرا. السبب: ${err}. يرجى التحقق من منح الإذن للمتصفح عبر النقر على علامة القفل بجانب الرابط.`;
            resultText.innerText = "فشل بدء المسح.";
        }
    });

    // دالة إيقاف الكاميرا بأمان
    stopBtn.addEventListener('click', async () => {
        if (html5QrCode) {
            try {
                await html5QrCode.stop();
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
                resultText.innerText = "تم إيقاف الكاميرا.";
                errorLog.style.display = 'none';
            } catch (err) {
                console.error("Failed to stop", err);
            }
        }
    });
</script>

</body>
</html>
