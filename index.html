<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح PDF417 - يعمل على HTTPS</title>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #16213e;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }
        h1 { text-align: center; color: #e94560; margin-bottom: 15px; font-size: 1.6rem; }
        .video-box {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .scan-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #e94560;
            width: 80%; height: 40%;
            border-radius: 10px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(233,69,96,0.6);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        button, .btn {
            background: #0f3460;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            flex: 1 1 auto;
            font-size: 1rem;
            text-align: center;
            transition: background 0.2s;
        }
        button:hover, .btn:hover { background: #e94560; }
        #stopBtn, #snapBtn { display: none; }
        #fileInput { display: none; }
        .result-box {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            word-break: break-all;
            font-family: monospace;
            text-align: center;
            min-height: 50px;
            margin-bottom: 10px;
        }
        .status {
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            margin: 5px 0;
        }
        .note {
            background: #2a2a4a;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #ccc;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📷 ماسح PDF417</h1>

    <div class="video-box">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-overlay"></div>
    </div>

    <div class="controls">
        <button id="startBtn">▶️ بدء الكاميرا</button>
        <button id="snapBtn">📸 التقط صورة</button>
        <button id="stopBtn">⏹️ إيقاف</button>
        <label for="fileInput" class="btn">📁 رفع صورة</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="result-box" id="result">النتيجة تظهر هنا...</div>
    <div class="status" id="status">جاهز للتشغيل</div>

    <div class="note">
        <strong>مهم:</strong> يجب فتح الصفحة عبر HTTPS أو localhost.<br>
        إذا لم تعمل الكاميرا، ارفع الملف إلى GitHub Pages كما هو موضح في الأسفل.
    </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('startBtn');
    const snapBtn = document.getElementById('snapBtn');
    const stopBtn = document.getElementById('stopBtn');
    const fileInput = document.getElementById('fileInput');
    const resultDiv = document.getElementById('result');
    const statusDiv = document.getElementById('status');

    let stream = null;
    let scanActive = false;
    let scanInterval = null;

    // إعداد ZXing للبحث عن PDF417 مع محاولة أكبر
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.PDF_417]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const reader = new ZXing.BrowserMultiFormatReader(hints);

    // فتح الكاميرا وبدء المسح المباشر
    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            video.srcObject = stream;
            await video.play();

            startBtn.style.display = 'none';
            snapBtn.style.display = 'inline-block';
            stopBtn.style.display = 'inline-block';
            scanActive = true;
            statusDiv.textContent = 'الكاميرا تعمل والمسح المباشر نشط... وجّه الباركود';

            // بدء المسح المباشر كل 500 مللي
            scanInterval = setInterval(scanFromVideo, 500);
            resultDiv.textContent = '... انتظار';
        } catch (err) {
            statusDiv.textContent = 'فشل فتح الكاميرا: ' + err.message;
            alert('تعذر الوصول للكاميرا. تأكد من السماح بالإذن وأن الصفحة على HTTPS.');
        }
    }

    // المسح المباشر من الفيديو
    function scanFromVideo() {
        if (!scanActive || video.readyState < 2) return;
        reader.decodeFromVideoElement(video)
            .then(result => {
                if (result) {
                    resultDiv.textContent = result.getText();
                    statusDiv.textContent = '✅ تم الاكتشاف!';
                    // يمكن إيقاف المسح بعد النجاح
                    // stopCamera();
                }
            })
            .catch(err => {
                // NotFoundException طبيعي جدًا
                if (!(err instanceof ZXing.NotFoundException)) {
                    console.warn('خطأ في المسح:', err);
                }
            });
    }

    // التقاط صورة وتحليلها (أكثر دقة مع PDF417 الكثيف)
    function captureAndDecode() {
        if (!stream || video.readyState < 2) {
            alert('الكاميرا غير جاهزة.');
            return;
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        statusDiv.textContent = 'جارٍ تحليل اللقطة...';
        const img = new Image();
        img.src = canvas.toDataURL('image/png');
        img.onload = () => {
            reader.decodeFromImageElement(img)
                .then(result => {
                    resultDiv.textContent = result.getText();
                    statusDiv.textContent = '✅ تم الاكتشاف من اللقطة!';
                })
                .catch(err => {
                    resultDiv.textContent = 'لم يتم العثور على PDF417 في اللقطة. حاول مجددًا.';
                    statusDiv.textContent = 'فشل التحليل';
                });
        };
    }

    // تحليل صورة مرفوعة
    function handleFileUpload(file) {
        if (!file) return;
        statusDiv.textContent = 'جارٍ تحليل الصورة المرفوعة...';
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            reader.decodeFromImageElement(img)
                .then(result => {
                    resultDiv.textContent = result.getText();
                    statusDiv.textContent = '✅ تم الاكتشاف من الصورة!';
                })
                .catch(err => {
                    resultDiv.textContent = 'لم يتم العثور على باركود PDF417 في الصورة.';
                    statusDiv.textContent = 'فشل التحليل';
                });
        };
    }

    // إيقاف الكاميرا
    function stopCamera() {
        scanActive = false;
        if (scanInterval) clearInterval(scanInterval);
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        video.srcObject = null;
        startBtn.style.display = 'inline-block';
        snapBtn.style.display = 'none';
        stopBtn.style.display = 'none';
        statusDiv.textContent = 'متوقف';
    }

    // الأحداث
    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    snapBtn.addEventListener('click', captureAndDecode);
    fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) handleFileUpload(e.target.files[0]);
    });

    // تنظيف
    window.addEventListener('beforeunload', stopCamera);
</script>
</body>
        </html>
