<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ماسح النصوص OCR - عربي وإنجليزي</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #0b0c10 0%, #1f2833 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }
    .container {
      background: rgba(20, 25, 35, 0.75);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 28px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    h1 {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 5px;
      background: linear-gradient(to right, #f9d423, #ff4e50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      text-align: center;
      color: #a0aab5;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto 20px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.12);
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      /* إزالة الانعكاس التلقائي - سيتم التحكم به عبر الكاميرا المناسبة */
    }
    .video-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5a6370;
      font-size: 1.2rem;
      background: #141a22;
      width: 100%;
      height: 100%;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 20px 0 10px;
    }
    .btn {
      padding: 12px 22px;
      border: none;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      color: #ddd;
      border: 1px solid rgba(255,255,255,0.15);
      letter-spacing: 0.4px;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      border: none;
      color: #0a0f14;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(56, 239, 125, 0.25);
    }
    .btn-primary.stop {
      background: linear-gradient(135deg, #cb2d3e, #ef473a);
      box-shadow: 0 8px 20px rgba(239, 71, 58, 0.3);
    }
    .btn-capture {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      border: none;
      color: #1a1a2e;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(255, 210, 0, 0.3);
    }
    .btn-ocr {
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      border: none;
      box-shadow: 0 8px 20px rgba(138, 43, 226, 0.35);
      color: white;
      font-weight: 700;
    }
    .lang-selector {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    .lang-btn {
      padding: 8px 18px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.25);
      background: transparent;
      color: #bbb;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.3s;
      font-weight: 500;
    }
    .lang-btn.active {
      background: rgba(56, 239, 125, 0.12);
      border-color: #38ef7d;
      color: #38ef7d;
      box-shadow: 0 0 16px rgba(56,239,125,0.25);
    }
    .result-area {
      background: rgba(10, 15, 22, 0.75);
      border-radius: 20px;
      padding: 20px;
      min-height: 130px;
      border: 1px solid rgba(255,255,255,0.12);
      position: relative;
      margin-top: 15px;
      backdrop-filter: blur(12px);
    }
    .result-label {
      font-size: 0.8rem;
      color: #8892a0;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .result-text {
      font-size: 1.1rem;
      line-height: 1.9;
      word-break: break-word;
      white-space: pre-wrap;
      color: #e2e8f0;
      min-height: 60px;
      max-height: 260px;
      overflow-y: auto;
    }
    .result-text:empty::after {
      content: "النص المستخرج سيظهر هنا...";
      color: #4a5568;
      font-style: italic;
    }
    .copy-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      color: #ccd6e0;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.3s;
    }
    .copy-btn:hover {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }
    .status-text {
      text-align: center;
      font-size: 0.85rem;
      color: #8892a0;
      margin: 8px 0;
      min-height: 24px;
    }
    canvas {
      display: none;
    }
    .switch-cam-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ccc;
    }
    @media (max-width: 500px) {
      .container {
        padding: 20px;
      }
      .btn {
        padding: 10px 16px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📷 الماسح الذكي</h1>
  <p class="subtitle">افتح الكاميرا، التقط صورة، واستخرج النص العربي والإنجليزي</p>

  <div class="video-wrapper" id="videoWrapper">
    <video id="video" autoplay playsinline muted></video>
    <div class="video-placeholder" id="videoPlaceholder">
      <span>📸 الكاميرا متوقفة</span>
    </div>
  </div>
  <canvas id="canvas"></canvas>

  <!-- اختيار اللغة -->
  <div class="lang-selector">
    <button class="lang-btn active" data-lang="ara+eng">🌐 عربي + إنجليزي</button>
    <button class="lang-btn" data-lang="ara">🇸🇦 عربي</button>
    <button class="lang-btn" data-lang="eng">🇬🇧 إنجليزي</button>
  </div>

  <!-- أزرار التحكم -->
  <div class="controls">
    <button class="btn btn-primary" id="btnToggleCam">▶️ تشغيل الكاميرا</button>
    <button class="btn switch-cam-btn" id="btnSwitchCam" disabled title="تبديل الكاميرا (أمامية/خلفية)">🔄 تبديل</button>
    <button class="btn btn-capture" id="btnCapture" disabled>📷 التقاط صورة</button>
    <button class="btn btn-ocr" id="btnOCR" disabled>🔍 تعرف على النص</button>
  </div>

  <div class="status-text" id="status"></div>

  <div class="result-area" id="resultArea">
    <span class="result-label">📝 النص المستخرج</span>
    <button class="copy-btn" id="btnCopy" style="display:none;">📋 نسخ</button>
    <div class="result-text" id="resultText"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  (function() {
    const video = document.getElementById('video');
    const videoPlaceholder = document.getElementById('videoPlaceholder');
    const canvas = document.getElementById('canvas');
    const btnToggleCam = document.getElementById('btnToggleCam');
    const btnSwitchCam = document.getElementById('btnSwitchCam');
    const btnCapture = document.getElementById('btnCapture');
    const btnOCR = document.getElementById('btnOCR');
    const resultText = document.getElementById('resultText');
    const statusEl = document.getElementById('status');
    const btnCopy = document.getElementById('btnCopy');
    const langBtns = document.querySelectorAll('.lang-btn');

    let stream = null;
    let capturedImageData = null;
    let selectedLang = 'ara+eng';
    let ocrWorker = null;
    let isProcessing = false;
    let currentFacingMode = 'environment'; // الكاميرا الخلفية افتراضياً (لا تحتاج انعكاس)

    // --- إدارة اللغة ---
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedLang = btn.dataset.lang;
        initOCRWorker(); // إعادة تهيئة العامل باللغة الجديدة
      });
    });

    async function initOCRWorker() {
      if (ocrWorker) {
        try { await ocrWorker.terminate(); } catch (e) {}
        ocrWorker = null;
      }
      setStatus('⏳ تحميل بيانات اللغة...');
      try {
        ocrWorker = await Tesseract.createWorker(selectedLang, 1, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const progress = m.progress ? Math.round(m.progress * 100) : 0;
              setStatus(`🔍 يتعرف على النص... ${progress}%`);
            }
          }
        });
        await ocrWorker.setParameters({
          tessedit_pageseg_mode: '6', // كتلة نصية موحدة (مناسب للمستندات)
          preserve_interword_spaces: '1',
        });
        setStatus('✅ جاهز للتعرف على النص');
      } catch (err) {
        console.error(err);
        setStatus('❌ فشل تحميل اللغة. تأكد من اتصالك بالإنترنت.');
        ocrWorker = null;
      }
    }

    // --- الكاميرا ---
    async function startCamera(facingMode = currentFacingMode) {
      stopCamera(); // إيقاف أي بث سابق
      try {
        setStatus('⏳ فتح الكاميرا...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        videoPlaceholder.style.display = 'none';
        video.style.display = 'block';
        btnToggleCam.textContent = '⏹️ إيقاف الكاميرا';
        btnToggleCam.classList.add('stop');
        btnCapture.disabled = false;
        btnSwitchCam.disabled = false;
        currentFacingMode = facingMode;
        setStatus(`📸 الكاميرا (${facingMode === 'environment' ? 'خلفية' : 'أمامية'}) جاهزة`);
        await new Promise(resolve => video.onloadedmetadata = resolve);
        await video.play();
      } catch (err) {
        console.error(err);
        setStatus('❌ تعذر فتح الكاميرا. تحقق من الصلاحيات.');
        stream = null;
        btnSwitchCam.disabled = true;
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      video.style.display = 'none';
      videoPlaceholder.style.display = 'flex';
      btnToggleCam.textContent = '▶️ تشغيل الكاميرا';
      btnToggleCam.classList.remove('stop');
      btnCapture.disabled = true;
      btnSwitchCam.disabled = true;
      btnOCR.disabled = true;
      capturedImageData = null;
      setStatus('الكاميرا متوقفة');
    }

    function toggleCamera() {
      if (stream) {
        stopCamera();
      } else {
        startCamera(currentFacingMode);
      }
    }

    function switchCamera() {
      if (!stream) return;
      const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCamera(newMode);
    }

    // --- التقاط صورة بدون انعكاس غير ضروري ---
    function captureImage() {
      if (!stream || video.readyState < 2) {
        setStatus('⚠️ الكاميرا غير جاهزة بعد');
        return;
      }
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      // رسم الفيديو كما هو (بدون قلب) لأن الكاميرا الخلفية تعرض الصورة الصحيحة
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      capturedImageData = canvas.toDataURL('image/png');
      btnOCR.disabled = false;
      setStatus('✅ تم الالتقاط | اضغط "تعرف على النص"');
      // تأثير وميض
      const wrapper = document.getElementById('videoWrapper');
      wrapper.style.boxShadow = '0 0 35px rgba(255,210,0,0.65)';
      setTimeout(() => { wrapper.style.boxShadow = '0 12px 30px rgba(0,0,0,0.6)'; }, 350);
    }

    // --- التعرف على النص ---
    async function runOCR() {
      if (!capturedImageData) {
        setStatus('⚠️ التقط صورة أولاً');
        return;
      }
      if (!ocrWorker) {
        setStatus('⏳ جاري تحضير نظام التعرف...');
        await initOCRWorker();
        if (!ocrWorker) return;
      }
      if (isProcessing) return;
      isProcessing = true;
      btnOCR.disabled = true;
      btnCapture.disabled = true;
      resultText.textContent = '';
      btnCopy.style.display = 'none';
      setStatus('🔍 جاري التعرف...');

      try {
        const { data: { text } } = await ocrWorker.recognize(capturedImageData);
        const cleaned = text.trim();
        if (cleaned) {
          resultText.textContent = cleaned;
          btnCopy.style.display = 'inline-block';
          setStatus('✅ تم التعرف على النص بنجاح');
        } else {
          resultText.textContent = '';
          setStatus('⚠️ لم يتم التعرف على نص. جرب صورة أوضح أو لغة أخرى.');
        }
      } catch (err) {
        console.error(err);
        setStatus('❌ خطأ في التعرف. حاول مرة أخرى.');
      } finally {
        isProcessing = false;
        btnOCR.disabled = false;
        btnCapture.disabled = false;
      }
    }

    function copyText() {
      const text = resultText.textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btnCopy.textContent;
        btnCopy.textContent = '✅ تم النسخ';
        setTimeout(() => { btnCopy.textContent = orig; }, 2000);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btnCopy.textContent = '✅ تم النسخ';
        setTimeout(() => { btnCopy.textContent = '📋 نسخ'; }, 2000);
      });
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    // --- دعم السحب والإفلات ---
    const resultArea = document.getElementById('resultArea');
    resultArea.addEventListener('dragover', e => {
      e.preventDefault();
      resultArea.style.borderColor = '#38ef7d';
    });
    resultArea.addEventListener('dragleave', () => {
      resultArea.style.borderColor = 'rgba(255,255,255,0.12)';
    });
    resultArea.addEventListener('drop', async e => {
      e.preventDefault();
      resultArea.style.borderColor = 'rgba(255,255,255,0.12)';
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = ev => {
          capturedImageData = ev.target.result;
          btnOCR.disabled = false;
          setStatus('✅ صورة جاهزة | اضغط "تعرف على النص"');
        };
        reader.readAsDataURL(file);
      }
    });

    // --- الأحداث ---
    btnToggleCam.addEventListener('click', toggleCamera);
    btnSwitchCam.addEventListener('click', switchCamera);
    btnCapture.addEventListener('click', captureImage);
    btnOCR.addEventListener('click', runOCR);
    btnCopy.addEventListener('click', copyText);

    // --- التهيئة الأولى ---
    initOCRWorker().then(() => {
      setStatus('👋 جاهز | شغّل الكاميرا وابدأ');
    });

    window.addEventListener('beforeunload', () => {
      stopCamera();
      if (ocrWorker) ocrWorker.terminate().catch(()=>{});
    });

    console.log('🚀 ماسح النصوص OCR جاهز | عربي وإنجليزي');
  })();
</script>
</body>
</html>
