<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح باركود الهويات والمستندات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; padding: 15px; margin: 0; }
        h2 { color: #333; margin-bottom: 5px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-top: 15px; }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #0056b3; }
        #stop-btn { background: #dc3545; display: none; }
        #stop-btn:hover { background: #bd2130; }
        #result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; text-align: right; word-break: break-all; border-right: 5px solid #28a745; }
        #error-log { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 14px; text-align: center; display: none; }
        select { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; display: none; }
    </style>
    
    <!-- استخدام سيرفر jsDelivr العالمي بنسخة التصفح المصغرة والمستقرة 100% -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h2>قارئ باركود PDF417 السوري</h2>
    <p style="color: #666; font-size: 14px;">قم بتشغيل الكاميرا الخلفية للمسح التلقائي</p>

    <!-- قائمة لاختيار الكاميرا يدوياً إذا لزم الأمر -->
    <select id="camera-select"></select>

    <!-- مكان عرض الكاميرا -->
    <div id="reader"></div>

    <button id="start-btn">تشغيل الكاميرا وبدء المسح</button>
    <button id="stop-btn">إيقاف الكاميرا</button>

    <div id="error-log"></div>

    <div id="result-box">
        <strong>البيانات المستخرجة للبطاقة:</strong>
        <p id="result-text" style="color: #333; font-family: monospace; margin-top: 8px;">في انتظار مسح الكود...</p>
    </div>
</div>

<script>
    let html5QrCode = null;
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const resultText = document.getElementById('result-text');
    const errorLog = document.getElementById('error-log');
    const cameraSelect = document.getElementById('camera-select');

    // دالة تهيئة الكاميرات المتاحة في الجهاز أولاً
    async function initCameras() {
        try {
            // التحقق من وجود المكتبة أولاً لتلافي أخطاء التعريف
            if (typeof Html5Qrcode === 'undefined') {
                setTimeout(initCameras, 500); // إعادة المحاولة بعد نصف ثانية إذا تأخر تحميل السيرفر
                return;
            }
            
            const devices = await Html5Qrcode.getCameras();
            if (devices && devices.length > 0) {
                cameraSelect.innerHTML = "";
                devices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.id;
                    // تمييز الكاميرا الخلفية لتسهيل اختيارها
                    option.text = device.label || `كاميرا ${index + 1}`;
                    if(device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('environment')) {
                        option.selected = true;
                    }
                    cameraSelect.appendChild(option);
                });
                cameraSelect.style.display = 'block'; // إظهار قائمة الكاميرات للمستخدم
            }
        } catch (err) {
            console.error("خطأ في جلب الكاميرات:", err);
        }
    }

    // تشغيل جلب الكاميرات فور تحميل الصفحة
    window.addEventListener('DOMContentLoaded', initCameras);

    startBtn.addEventListener('click', async () => {
        errorLog.style.display = 'none';
        resultText.innerText = "جاري الاتصال بالكاميرا المحددة...";

        if (typeof Html5Qrcode === 'undefined') {
            errorLog.style.display = 'block';
            errorLog.innerText = "المتصفح لم يقم بتحميل محرك التشفير بعد، يرجى الانتظار 3 ثوانٍ والمحاولة مجدداً.";
            return;
        }

        try {
            // إنشاء كائن المسح داخل صندوق القارئ
            html5QrCode = new Html5Qrcode("reader");

            // إعدادات أبعاد مساحة الفحص ومطابقتها لباركود البطاقات الشخصية (مستطيل عريض)
            const config = {
                fps: 20,
                qrbox: (width, height) => {
                    return { width: Math.min(width * 0.85, 400), height: Math.min(height * 0.4, 150) };
                },
                formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ] // تفعيل محرك الـ PDF417 فقط للحصول على أقصى سرعة وقوة قراءة
            };

            // جلب الكاميرا المختارة من القائمة لتفادي تخبيص المتصفح
            const selectedCameraId = cameraSelect.value;
            
            if (!selectedCameraId) {
                // محاولة تشغيل الكاميرا الافتراضية البيئية (الخلفية) إذا لم تظهر القائمة
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
            } else {
                // تشغيل الكاميرا المحددة بدقة
                await html5QrCode.start(selectedCameraId, config, onScanSuccess);
            }

            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            cameraSelect.disabled = true;
            resultText.innerText = "وجه الكاميرا بثبات تام واجعل الخطوط السوداء للباركود بداخل المستطيل المضيء...";

        } catch (err) {
            console.error(err);
            errorLog.style.display = 'block';
            errorLog.innerText = `فشل البدء: تأكد من منح المتصفح إذن الكاميرا بالموقع الحالي (HTTPS).`;
            resultText.innerText = "فشل بدء المسح.";
        }
    });

    // دالة معالجة نجاح القراءة والتقاط النصوص
    function onScanSuccess(decodedText, decodedResult) {
        resultText.innerHTML = `<span style="color:#28a745; font-weight:bold; font-size:16px;">${decodedText}</span>`;
        if (navigator.vibrate) navigator.vibrate(200); // اهتزاز الهاتف للتنبيه
    }

    // دالة إيقاف الكاميرا
    stopBtn.addEventListener('click', async () => {
        if (html5QrCode) {
            try {
                await html5QrCode.stop();
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
                cameraSelect.disabled = false;
                resultText.innerText = "تم إيقاف الكاميرا.";
                errorLog.style.display = 'none';
            } catch (err) {
                console.error("خطأ أثناء الإيقاف:", err);
            }
        }
    });
</script>

</body>
</html>
