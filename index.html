<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Lens OCR | واجهة محسّنة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Google Sans', 'Segoe UI', Tahoma, sans-serif;
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      color: white;
    }
    .scanner-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    /* شريط علوي جديد - يحتوي كل الأزرار */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(20px);
      border-radius: 50px;
      padding: 6px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .lang-selector {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 40px;
      padding: 3px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #ddd;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
      white-space: nowrap;
    }
    .lang-btn.active {
      background: #4285f4;
      color: white;
      box-shadow: 0 2px 10px rgba(66,133,244,0.5);
    }
    .action-icons {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border: none;
      color: white;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }
    .icon-btn.active {
      background: #4285f4;
      box-shadow: 0 0 15px rgba(66,133,244,0.6);
    }
    .icon-btn:active {
      transform: scale(0.9);
    }
    /* بطاقة النتيجة المنبثقة */
    .result-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(18, 22, 28, 0.92);
      backdrop-filter: blur(30px);
      border-radius: 28px 28px 0 0;
      padding: 20px 20px 25px;
      color: white;
      z-index: 30;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 60vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.7);
    }
    .result-sheet.visible {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 36px;
      height: 5px;
      background: rgba(255,255,255,0.4);
      border-radius: 10px;
      margin: 0 auto 15px;
    }
    .result-text {
      font-size: 1.6rem;
      line-height: 2.1;
      word-break: break-word;
      white-space: pre-wrap;
      color: #f1f5f9;
      text-align: right;
      overflow-y: auto;
      max-height: 40vh;
      padding-bottom: 10px;
      font-weight: 400;
    }
    .sheet-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .action-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #e2e8f0;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .action-btn.primary {
      background: #4285f4;
      color: white;
    }
    canvas {
      display: none;
    }
    @media (max-width: 480px) {
      .lang-btn {
        padding: 6px 10px;
        font-size: 0.7rem;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
<div class="scanner-container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="preprocessCanvas"></canvas>

  <!-- شريط علوي شامل -->
  <div class="top-bar">
    <div class="lang-selector">
      <button class="lang-btn active" data-lang="ara+eng">عربي + إنجليزي</button>
      <button class="lang-btn" data-lang="ara">عربي</button>
      <button class="lang-btn" data-lang="eng">إنجليزي</button>
    </div>
    <div class="action-icons">
      <button class="icon-btn" id="btnToggleLive" title="بث مباشر">🔴</button>
      <button class="icon-btn" id="btnCapture" title="التقاط">📷</button>
      <button class="icon-btn" id="btnSwitchCam" title="تبديل الكاميرا">🔄</button>
    </div>
  </div>

  <!-- بطاقة النتيجة -->
  <div class="result-sheet" id="resultSheet">
    <div class="sheet-handle"></div>
    <div class="result-text" id="resultText"></div>
    <div class="sheet-actions">
      <button class="action-btn" id="btnCopy">📋 نسخ</button>
      <button class="action-btn" id="btnSearch">🔍 بحث</button>
      <button class="action-btn" id="btnTranslate">🌐 ترجمة</button>
      <button class="action-btn" id="btnClose">✕ إغلاق</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  (function() {
    const video = document.getElementById('video');
    const preCanvas = document.getElementById('preprocessCanvas');
    const resultText = document.getElementById('resultText');
    const resultSheet = document.getElementById('resultSheet');
    const btnCapture = document.getElementById('btnCapture');
    const btnToggleLive = document.getElementById('btnToggleLive');
    const btnSwitchCam = document.getElementById('btnSwitchCam');
    const btnCopy = document.getElementById('btnCopy');
    const btnSearch = document.getElementById('btnSearch');
    const btnTranslate = document.getElementById('btnTranslate');
    const btnClose = document.getElementById('btnClose');
    const langBtns = document.querySelectorAll('.lang-btn');

    let stream = null;
    let currentFacingMode = 'environment';
    let selectedLang = 'ara+eng';
    let ocrWorker = null;
    let liveMode = false;
    let liveInterval = null;
    let isProcessing = false;
    let lastRecognizedText = '';

    // --- معالجة الصورة بدقة ---
    async function preprocessImage(imageDataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = preCanvas;
          const ctx = c.getContext('2d');
          let width = img.width * 2;
          let height = img.height * 2;
          const maxDim = 1400;
          if (width > maxDim || height > maxDim) {
            const scale = Math.min(maxDim / width, maxDim / height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          c.width = width;
          c.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          const imageData = ctx.getImageData(0, 0, width, height);
          const data = imageData.data;
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            let gray = 0.299 * r + 0.587 * g + 0.114 * b;
            gray = (gray - 128) * 1.6 + 128;
            gray = Math.min(255, Math.max(0, gray));
            data[i] = data[i+1] = data[i+2] = gray;
          }
          ctx.putImageData(imageData, 0, 0);
          // تمويه بسيط لتقليل الضوضاء
          const blurredData = ctx.getImageData(0, 0, width, height);
          const blurred = blurredData.data;
          for (let y = 1; y < height-1; y++) {
            for (let x = 1; x < width-1; x++) {
              let sum = 0;
              for (let ky = -1; ky <= 1; ky++) {
                for (let kx = -1; kx <= 1; kx++) {
                  const idx = ((y+ky)*width + (x+kx))*4;
                  sum += data[idx];
                }
              }
              const avg = sum/9;
              const idx = (y*width + x)*4;
              blurred[idx] = blurred[idx+1] = blurred[idx+2] = avg;
            }
          }
          ctx.putImageData(blurredData, 0, 0);
          resolve(c.toDataURL('image/png'));
        };
        img.src = imageDataUrl;
      });
    }

    async function initOCRWorker() {
      if (ocrWorker) { try { await ocrWorker.terminate(); } catch(e) {} ocrWorker = null; }
      try {
        ocrWorker = await Tesseract.createWorker(selectedLang, 1, { logger: () => {} });
        await ocrWorker.setParameters({
          tessedit_pageseg_mode: '6',
          preserve_interword_spaces: '1',
          tessedit_ocr_engine_mode: '2',
        });
      } catch (err) { console.error(err); }
    }

    async function startCamera(facingMode = currentFacingMode) {
      stopCamera();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        currentFacingMode = facingMode;
        video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'none';
        await video.play();
      } catch (err) { console.error(err); }
    }

    function stopCamera() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      video.srcObject = null;
      stopLiveMode();
    }

    function switchCamera() {
      startCamera(currentFacingMode === 'environment' ? 'user' : 'environment');
    }

    async function recognizeImage(imageDataUrl) {
      if (!ocrWorker) await initOCRWorker();
      if (!ocrWorker) return '';
      try {
        const processed = await preprocessImage(imageDataUrl);
        const { data: { text } } = await ocrWorker.recognize(processed);
        return text.trim();
      } catch (e) { return ''; }
    }

    function captureFrame() {
      if (!stream || video.readyState < 2) return null;
      const c = document.createElement('canvas');
      c.width = video.videoWidth; c.height = video.videoHeight;
      const ctx = c.getContext('2d');
      if (currentFacingMode === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
      ctx.drawImage(video, 0, 0);
      return c.toDataURL('image/png');
    }

    function showResult(text) {
      resultText.textContent = text;
      resultSheet.classList.add('visible');
    }

    function hideResult() {
      resultSheet.classList.remove('visible');
    }

    // --- البث المباشر ---
    function startLiveMode() {
      if (!stream) return;
      liveMode = true;
      btnToggleLive.classList.add('active');
      if (liveInterval) clearInterval(liveInterval);
      liveInterval = setInterval(async () => {
        if (!liveMode || isProcessing) return;
        const frame = captureFrame();
        if (!frame) return;
        isProcessing = true;
        const text = await recognizeImage(frame);
        if (text && text !== lastRecognizedText) {
          lastRecognizedText = text;
          showResult(text);
        }
        isProcessing = false;
      }, 1300);
    }

    function stopLiveMode() {
      liveMode = false;
      if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
      btnToggleLive.classList.remove('active');
    }

    function toggleLiveMode() {
      if (liveMode) stopLiveMode(); else startLiveMode();
    }

    async function takeSnapshot() {
      if (!stream) return;
      const frame = captureFrame();
      if (!frame) return;
      const text = await recognizeImage(frame);
      if (text) {
        showResult(text);
        lastRecognizedText = text;
      }
    }

    // --- إجراءات البطاقة ---
    function copyText() {
      const text = resultText.textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        btnCopy.innerHTML = '✅ تم النسخ';
        setTimeout(() => { btnCopy.innerHTML = '📋 نسخ'; }, 2000);
      });
    }

    function searchText() {
      const text = resultText.textContent;
      if (text) window.open(`https://www.google.com/search?q=${encodeURIComponent(text)}`, '_blank');
    }

    function translateText() {
      const text = resultText.textContent;
      if (text) window.open(`https://translate.google.com/?text=${encodeURIComponent(text)}`, '_blank');
    }

    // --- ربط الأحداث ---
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedLang = btn.dataset.lang;
        initOCRWorker();
        hideResult();
      });
    });

    btnCapture.addEventListener('click', takeSnapshot);
    btnToggleLive.addEventListener('click', toggleLiveMode);
    btnSwitchCam.addEventListener('click', switchCamera);
    btnCopy.addEventListener('click', copyText);
    btnSearch.addEventListener('click', searchText);
    btnTranslate.addEventListener('click', translateText);
    btnClose.addEventListener('click', hideResult);

    // سحب وإفلات
    document.body.addEventListener('dragover', e => e.preventDefault());
    document.body.addEventListener('drop', async e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const text = await recognizeImage(ev.target.result);
          if (text) showResult(text);
        };
        reader.readAsDataURL(file);
      }
    });

    initOCRWorker().then(() => startCamera('environment'));

    window.addEventListener('beforeunload', () => {
      stopLiveMode();
      stopCamera();
      if (ocrWorker) ocrWorker.terminate();
    });
  })();
</script>
</body>
</html>
