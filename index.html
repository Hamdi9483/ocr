<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح باركود PDF417</title>
    <!-- مكتبة ZXing للتعامل مع الباركود -->
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #16213e;
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #e94560;
            font-size: 1.8rem;
        }
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* عكس الكاميرا الأمامية لتكون كالمرآة */
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        button, .file-label {
            flex: 1 1 auto;
            background: #0f3460;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            transition: background 0.3s;
        }
        button:hover, .file-label:hover {
            background: #e94560;
        }
        #stopBtn { display: none; }
        #fileInput { display: none; }
        .file-label {
            background: #0f3460;
            display: inline-block;
        }
        .result-box {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            min-height: 60px;
            word-break: break-all;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 1rem;
            text-align: center;
            color: #f5f5f5;
        }
        .note {
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 ماسح PDF417</h1>

        <div class="video-container">
            <video id="video" autoplay playsinline></video>
        </div>

        <div class="controls">
            <button id="startBtn">📸 فتح الكاميرا</button>
            <button id="stopBtn">⏹️ إيقاف</button>
            <label for="fileInput" class="file-label">📁 رفع صورة</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="result-box" id="result">النتيجة ستظهر هنا...</div>
        <div class="note">
            يعمل على HTTPS أو localhost فقط لتفعيل الكاميرا.
        </div>
    </div>

    <script>
        // العناصر
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const fileInput = document.getElementById('fileInput');
        const resultDiv = document.getElementById('result');

        // إعداد قارئ ZXing مع تحديد PDF417 فقط
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.PDF_417]);
        const reader = new ZXing.BrowserMultiFormatReader(hints);

        let selectedDeviceId = null;

        // دالة بدء المسح من الكاميرا
        async function startScanning() {
            try {
                // الحصول على قائمة الكاميرات واختيار الخلفية إن وُجدت
                const devices = await reader.listVideoInputDevices();
                if (devices.length === 0) {
                    alert('لم يتم العثور على كاميرا.');
                    return;
                }
                // تفضيل الكاميرا الخلفية (environment)
                const backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment'));
                selectedDeviceId = backCamera ? backCamera.deviceId : devices[0].deviceId;

                // بدء فك التشفير المستمر
                reader.decodeFromVideoDevice(selectedDeviceId, video, (result, err) => {
                    if (result) {
                        resultDiv.textContent = result.getText();
                        // يمكن إيقاف المسح بعد أول قراءة ناجحة
                        // stopScanning(); 
                    }
                    if (err && !(err instanceof ZXing.NotFoundException)) {
                        // أخطاء غير "لم يتم العثور" قد تكون مفيدة
                        console.error(err);
                    }
                });

                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
            } catch (error) {
                alert('خطأ في الوصول للكاميرا: ' + error.message);
            }
        }

        // إيقاف الكاميرا
        function stopScanning() {
            reader.reset();
            video.srcObject = null;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        }

        // فك ترميز صورة مرفوعة
        function decodeImage(file) {
            if (!file) return;
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                reader.decodeFromImageElement(img)
                    .then(result => {
                        resultDiv.textContent = result.getText();
                    })
                    .catch(err => {
                        resultDiv.textContent = 'لم يتم العثور على باركود PDF417 في الصورة.';
                        console.error(err);
                    });
            };
        }

        // ربط الأحداث
        startBtn.addEventListener('click', startScanning);
        stopBtn.addEventListener('click', stopScanning);
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                decodeImage(e.target.files[0]);
            }
        });

        // تنظيف عند مغادرة الصفحة
        window.addEventListener('beforeunload', () => {
            reader.reset();
        });
    </script>
</body>
</html>
