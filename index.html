<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قارئ باركود PDF417</title>
  
  <!-- مكتبة ZXing عبر CDN -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <!-- تنسيقات CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      aspect-ratio: 4 / 3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    #startBtn {
      background-color: #007bff;
      color: white;
    }
    #startBtn:hover { background-color: #0056b3; }

    #stopBtn {
      background-color: #dc3545;
      color: white;
    }
    #stopBtn:hover { background-color: #a71d2a; }

    .result-box {
      background: #e9ecef;
      padding: 15px;
      border-radius: 6px;
      text-align: right;
      border-right: 4px solid #007bff;
    }

    .result-box strong {
      display: block;
      margin-bottom: 5px;
      color: #495057;
    }

    #result {
      color: #212529;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>ماسح باركود PDF417</h2>

    <div class="video-wrapper">
      <video id="video"></video>
    </div>

    <div class="controls">
      <button id="startBtn">تشغيل الكاميرا</button>
      <button id="stopBtn">إيقاف</button>
    </div>

    <div class="result-box">
      <strong>النتيجة المستخرجة:</strong>
      <span id="result">في انتظار بدء المسح...</span>
    </div>
  </div>

  <!-- كود JavaScript -->
  <script>
    const codeReader = new ZXing.BrowserPDF417Reader();
    const videoElement = document.getElementById('video');
    const resultElement = document.getElementById('result');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    startBtn.addEventListener('click', async () => {
      try {
        const videoInputDevices = await codeReader.listVideoInputDevices();

        if (videoInputDevices.length === 0) {
          alert('لم يتم العثور على كاميرا في الجهاز.');
          return;
        }

        // اختيار الكاميرا الخلفية إن وجدت
        const backCamera = videoInputDevices.find(device => 
          device.label.toLowerCase().includes('back') || 
          device.label.toLowerCase().includes('environment')
        );
        const selectedDeviceId = backCamera ? backCamera.deviceId : videoInputDevices[0].deviceId;

        resultElement.textContent = 'جاري الكشف... وجه الكاميرا نحو باركود PDF417';

        // بدء القراءة المستمرة من الكاميرا
        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
          if (result) {
            resultElement.textContent = result.getText();
          }
          if (err && !(err instanceof ZXing.NotFoundException)) {
            console.error(err);
          }
        });

      } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء فتح الكاميرا: ' + err.message);
      }
    });

    stopBtn.addEventListener('click', () => {
      codeReader.reset();
      resultElement.textContent = 'تم إيقاف الكاميرا.';
    });
  </script>

</body>
</html>
