<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تجربة محرك Dynamsoft</title>
  <!-- استدعاء محرك WebAssembly -->
  <script src="https://cdn.jsdelivr.net/npm/dynamsoft-javascript-barcode@9.6.20/dist/dbr.js"></script>
</head>
<body>
  <h2>تجربة فك تشفير PDF417 عبر محرك C++ WebAssembly</h2>
  <input type="file" id="fileInput" accept="image/*">
  <pre id="output">اختر صورة الباركود...</pre>

  <script>
    // تهيئة الترخيص التجريبي المجاني المدمج
    Dynamsoft.DBR.BarcodeReader.license = 'DLS2eyJoYW5kc2hha2VDb2RlIjoiMjAwMDAxLTE2NDk4Mjk0MiIsIm9yZ2FuaXphdGlvbklEIjoiMjAwMDAxIn0=';

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('output').textContent = "جاري التحليل بالمحرك المتقدم...";
      
      try {
        const reader = await Dynamsoft.DBR.BarcodeReader.createInstance();
        // ضبط الإعدادات للتركيز على PDF417 فقط
        let settings = await reader.getRuntimeSettings();
        settings.barcodeFormatIds = Dynamsoft.DBR.EnumBarcodeFormat.BF_PDF417;
        await reader.updateRuntimeSettings(settings);

        const results = await reader.decode(file);
        
        if (results.length > 0) {
          document.getElementById('output').textContent = "تمت القراءة بنجاح:\n" + results[0].barcodeText;
        } else {
          document.getElementById('output').textContent = "لم يتم العثور على رمز PDF417 في الصورة.";
        }
      } catch (err) {
        document.getElementById('output').textContent = "خطأ: " + err.message;
      }
    });
  </script>
</body>
</html>
