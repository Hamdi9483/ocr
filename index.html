        <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح PDF417 - مضمون</title>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #16213e;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }
        h1 { text-align: center; color: #e94560; margin-bottom: 15px; }
        .alert {
            background: #ffc107;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }
        .video-box {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .scan-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #e94560;
            width: 80%; height: 40%;
            border-radius: 10px;
            pointer-events: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        button, .btn {
            background: #0f3460;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            flex: 1 1 auto;
            font-size: 1rem;
            text-align: center;
        }
        button:hover, .btn:hover { background: #e94560; }
        #stopBtn, #snapBtn { display: none; }
        #fileInput { display: none; }
        .result {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            word-break: break-all;
            font-family: monospace;
            text-align: center;
            min-height: 50px;
        }
        .note { font-size: 0.8rem; color: #aaa; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📷 ماسح الباركود</h1>
    <!-- تحذير سيظهر تلقائيًا إذا كان البروتوكول خطأ -->
    <div id="protocolAlert" class="alert" style="display: none;">
        ⚠️ الكاميرا لا تعمل على <code>file://</code><br>
        <small>افتح الصفحة عبر <strong>localhost</strong> أو HTTPS</small>
    </div>

    <div class="video-box">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-frame"></div>
    </div>

    <div class="controls">
        <button id="startBtn">📸 فتح الكاميرا</button>
        <button id="snapBtn">📷 التقط صورة وحلل</button>
        <button id="stopBtn">⏹️ إيقاف</button>
        <label for="fileInput" class="btn">📁 رفع صورة</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="result" id="result">النتيجة هنا...</div>
    <div class="note">وجّه الباركود داخل الإطار ثم اضغط "التقط صورة وحلل"</div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
    // إظهار تحذير إذا لم يكن البروتوكول آمنًا
    if (window.location.protocol === 'file:') {
        document.getElementById('protocolAlert').style.display = 'block';
    }

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('startBtn');
    const snapBtn = document.getElementById('snapBtn');
    const stopBtn = document.getElementById('stopBtn');
    const fileInput = document.getElementById('fileInput');
    const resultDiv = document.getElementById('result');

    let stream = null;
    const reader = new ZXing.BrowserMultiFormatReader();
    // إعدادات للبحث عن PDF417 (يمكنك تغييرها)
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.PDF_417]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    // فتح الكاميرا مباشرة
    async function openCamera() {
        try {
            // نطلب كاميرا خلفية بدقة عالية
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            video.srcObject = stream;
            await video.play();

            startBtn.style.display = 'none';
            snapBtn.style.display = 'inline-block';
            stopBtn.style.display = 'inline-block';
            resultDiv.textContent = 'الكاميرا جاهزة، وجّه الباركود ثم اضغط "التقط صورة وحلل"';
        } catch (err) {
            alert('فشل فتح الكاميرا: ' + err.message);
            console.error(err);
        }
    }

    // إيقاف الكاميرا
    function closeCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        video.srcObject = null;
        startBtn.style.display = 'inline-block';
        snapBtn.style.display = 'none';
        stopBtn.style.display = 'none';
    }

    // التقاط إطار وتحليله
    function captureAndDecode() {
        if (!stream || video.readyState < 2) {
            alert('الكاميرا غير جاهزة');
            return;
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        resultDiv.textContent = 'جارٍ تحليل الصورة...';

        const img = new Image();
        img.src = canvas.toDataURL('image/png');
        img.onload = () => {
            reader.decodeFromImageElement(img, hints)
                .then(result => {
                    resultDiv.textContent = result.getText();
                })
                .catch(err => {
                    resultDiv.textContent = 'لم يتم العثور على باركود PDF417. تأكد من وضوح الصورة والإضاءة.';
                    console.error(err);
                });
        };
    }

    // تحليل صورة مرفوعة
    function handleFileUpload(file) {
        if (!file) return;
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            reader.decodeFromImageElement(img, hints)
                .then(result => resultDiv.textContent = result.getText())
                .catch(err => {
                    resultDiv.textContent = 'لم يتم العثور على باركود في الصورة المرفوعة.';
                    console.error(err);
                });
        };
    }

    // ربط الأحداث
    startBtn.addEventListener('click', openCamera);
    stopBtn.addEventListener('click', closeCamera);
    snapBtn.addEventListener('click', captureAndDecode);
    fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) handleFileUpload(e.target.files[0]);
    });

    // تنظيف
    window.addEventListener('beforeunload', closeCamera);
</script>
</body>
</html>
