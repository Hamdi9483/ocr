<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>كاميرا ذكية - مربعات حول النصوص</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Google Sans', 'Segoe UI', Tahoma, sans-serif;
      background: #000; height:100vh; width:100vw;
      overflow: hidden; display:flex; color:white;
    }
    .scanner-container {
      position:relative; width:100%; height:100%;
      background:#000;
    }
    video {
      position:absolute; top:0; left:0;
      width:100%; height:100%;
      object-fit:cover; z-index:0;
      display:none;
    }
    #overlayCanvas {
      position:absolute; top:0; left:0;
      width:100%; height:100%;
      z-index:5; pointer-events:none;
    }
    .start-screen {
      position:absolute; top:0; left:0; width:100%; height:100%;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:#0b0f15; z-index:50; gap:20px;
    }
    .start-btn {
      background:#4285f4; color:white;
      border:none; padding:18px 50px;
      border-radius:60px; font-size:1.3rem;
      font-weight:600; cursor:pointer;
      box-shadow:0 8px 25px rgba(66,133,244,0.4);
      transition:0.2s;
    }
    .start-btn:active { transform:scale(0.96); }
    .top-bar {
      position:absolute; top:16px; left:16px; right:16px;
      display:none; justify-content:space-between; align-items:center;
      z-index:20; background:rgba(20,20,30,0.8);
      backdrop-filter:blur(20px); border-radius:50px;
      padding:6px 16px; box-shadow:0 4px 20px rgba(0,0,0,0.5);
    }
    .lang-selector {
      display:flex; gap:4px;
      background:rgba(255,255,255,0.08);
      border-radius:40px; padding:3px;
    }
    .lang-btn {
      background:transparent; border:none;
      color:#ddd; padding:8px 14px;
      border-radius:30px; font-size:0.78rem;
      cursor:pointer; font-weight:600; white-space:nowrap;
    }
    .lang-btn.active {
      background:#4285f4; color:white;
      box-shadow:0 2px 10px rgba(66,133,244,0.5);
    }
    .action-icons { display:flex; gap:8px; align-items:center; }
    .icon-btn {
      width:42px; height:42px; border-radius:50%;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(10px); border:none;
      color:white; font-size:1.3rem;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:0.2s;
    }
    .icon-btn.active { background:#4285f4; box-shadow:0 0 15px rgba(66,133,244,0.6); }
    .result-sheet {
      position:absolute; bottom:0; left:0; width:100%;
      background:rgba(18,22,28,0.92);
      backdrop-filter:blur(30px);
      border-radius:28px 28px 0 0;
      padding:20px 20px 25px; color:white;
      z-index:30;
      transform:translateY(100%);
      transition:transform 0.35s ease;
      max-height:60vh;
      display:flex; flex-direction:column;
      box-shadow:0 -8px 30px rgba(0,0,0,0.7);
    }
    .result-sheet.visible { transform:translateY(0); }
    .sheet-handle {
      width:36px; height:5px;
      background:rgba(255,255,255,0.4);
      border-radius:10px; margin:0 auto 15px;
    }
    .result-text {
      font-size:1.4rem; line-height:2;
      word-break:break-word; white-space:pre-wrap;
      color:#f1f5f9; text-align:right;
      overflow-y:auto; max-height:35vh;
      padding-bottom:10px; font-weight:400;
    }
    .sheet-actions {
      display:flex; gap:12px;
      justify-content:center; margin-top:12px;
      flex-wrap:wrap;
    }
    .action-btn {
      background:rgba(255,255,255,0.12);
      border:none; color:#e2e8f0;
      padding:10px 20px; border-radius:30px;
      font-weight:500; cursor:pointer;
      font-size:0.9rem;
      display:flex; align-items:center; gap:6px;
    }
    .action-btn.primary { background:#4285f4; color:white; }
    .loader {
      display:none; border:3px solid rgba(255,255,255,0.2);
      border-top:3px solid #4285f4;
      border-radius:50%; width:24px; height:24px;
      animation:spin 0.8s linear infinite; margin:10px auto;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div class="scanner-container" id="scannerContainer">
  <div class="start-screen" id="startScreen">
    <h2 style="font-size:2rem;">📷 ماسح النصوص الذكي</h2>
    <button class="start-btn" id="btnStartCamera">📸 تشغيل الكاميرا</button>
    <p style="color:#aaa;">ستظهر مربعات حول النصوص أثناء التصوير</p>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlayCanvas"></canvas>
  <div class="top-bar" id="topBar">
    <div class="lang-selector">
      <button class="lang-btn active" data-lang="ara+eng">عربي + إنجليزي</button>
      <button class="lang-btn" data-lang="ara">عربي</button>
      <button class="lang-btn" data-lang="eng">إنجليزي</button>
    </div>
    <div class="action-icons">
      <button class="icon-btn" id="btnToggleLive" title="إيقاف/تشغيل البث المباشر">🔴</button>
      <button class="icon-btn" id="btnCapture" title="لقطة">📷</button>
      <button class="icon-btn" id="btnSwitchCam" title="تبديل الكاميرا">🔄</button>
    </div>
  </div>
  <div class="result-sheet" id="resultSheet">
    <div class="sheet-handle"></div>
    <div class="result-text" id="resultText"></div>
    <div class="loader" id="loader"></div>
    <div class="sheet-actions">
      <button class="action-btn" id="btnCopy">📋 نسخ</button>
      <button class="action-btn" id="btnSearch">🔍 بحث</button>
      <button class="action-btn" id="btnTranslate">🌐 ترجمة</button>
      <button class="action-btn" id="btnClose">✕ إغلاق</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  (function() {
    const video = document.getElementById('video');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const startScreen = document.getElementById('startScreen');
    const topBar = document.getElementById('topBar');
    const resultText = document.getElementById('resultText');
    const resultSheet = document.getElementById('resultSheet');
    const loader = document.getElementById('loader');
    const btnStartCamera = document.getElementById('btnStartCamera');
    const btnCapture = document.getElementById('btnCapture');
    const btnToggleLive = document.getElementById('btnToggleLive');
    const btnSwitchCam = document.getElementById('btnSwitchCam');
    const btnCopy = document.getElementById('btnCopy');
    const btnSearch = document.getElementById('btnSearch');
    const btnTranslate = document.getElementById('btnTranslate');
    const btnClose = document.getElementById('btnClose');
    const langBtns = document.querySelectorAll('.lang-btn');

    let stream = null;
    let currentFacingMode = 'environment';
    let selectedLang = 'ara+eng';
    let ocrWorker = null;
    let liveMode = false;
    let liveInterval = null;
    let isProcessing = false;
    let lastFullText = '';
    let overlayCtx = overlayCanvas.getContext('2d');

    // --- إعداد Tesseract ---
    async function initOCRWorker() {
      if (ocrWorker) { await ocrWorker.terminate(); ocrWorker = null; }
      try {
        ocrWorker = await Tesseract.createWorker(selectedLang, 1, { logger: m => {} });
        await ocrWorker.setParameters({
          tessedit_pageseg_mode: '6',  // كتلة نصية
          preserve_interword_spaces: '1',
          tessedit_ocr_engine_mode: '2',
        });
      } catch (err) { console.error(err); }
    }

    // --- الكاميرا ---
    async function startCamera(facingMode = currentFacingMode) {
      stopCamera();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        currentFacingMode = facingMode;
        video.style.display = 'block';
        startScreen.style.display = 'none';
        topBar.style.display = 'flex';
        await video.play();
        resizeOverlay();
      } catch (err) {
        console.error(err);
        alert('تعذر فتح الكاميرا. تأكد من السماح بالوصول وأن الاتصال آمن (HTTPS أو localhost).');
      }
    }

    function stopCamera() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      video.srcObject = null;
      video.style.display = 'none';
      startScreen.style.display = 'flex';
      topBar.style.display = 'none';
      clearOverlay();
      stopLiveMode();
    }

    function switchCamera() {
      const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCamera(newMode);
    }

    function resizeOverlay() {
      overlayCanvas.width = video.videoWidth || 1280;
      overlayCanvas.height = video.videoHeight || 720;
    }

    function clearOverlay() {
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    }

    // --- معالجة الصورة (تباين) ---
    function preprocessFrame(imageDataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          const ctx = c.getContext('2d');
          const maxDim = 800;
          let width = img.width, height = img.height;
          if (width > maxDim || height > maxDim) {
            const scale = Math.min(maxDim/width, maxDim/height);
            width *= scale; height *= scale;
          }
          c.width = width; c.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          const imageData = ctx.getImageData(0,0,width,height);
          const data = imageData.data;
          for (let i=0; i<data.length; i+=4) {
            const r=data[i], g=data[i+1], b=data[i+2];
            let gray = 0.299*r + 0.587*g + 0.114*b;
            gray = (gray-128)*1.6 + 128;
            gray = Math.min(255, Math.max(0, gray));
            data[i]=data[i+1]=data[i+2]=gray;
          }
          ctx.putImageData(imageData,0,0);
          resolve(c.toDataURL('image/png'));
        };
        img.src = imageDataUrl;
      });
    }

    // --- التقاط الإطار وتحويله (مع الانعكاس للكاميرا الأمامية) ---
    function captureFrame() {
      if (!stream || video.readyState < 2) return null;
      const c = document.createElement('canvas');
      c.width = video.videoWidth;
      c.height = video.videoHeight;
      const ctx = c.getContext('2d');
      if (currentFacingMode === 'user') {
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0);
      return c.toDataURL('image/png');
    }

    // --- رسم المربعات ---
    function drawBoxes(words, videoWidth, videoHeight) {
      clearOverlay();
      if (!words || words.length === 0) return;
      
      const canvasRatioX = overlayCanvas.width / videoWidth;
      const canvasRatioY = overlayCanvas.height / videoHeight;
      
      overlayCtx.lineWidth = 3;
      overlayCtx.strokeStyle = '#38ef7d';
      overlayCtx.fillStyle = 'rgba(56,239,125,0.2)';
      
      for (let word of words) {
        const bbox = word.bbox;
        const x = bbox.x0 * canvasRatioX;
        const y = bbox.y0 * canvasRatioY;
        const w = (bbox.x1 - bbox.x0) * canvasRatioX;
        const h = (bbox.y1 - bbox.y0) * canvasRatioY;
        
        // ضبط الانعكاس للكاميرا الأمامية: نحتاج عكس إحداثيات x إذا كانت الكاميرا أمامية
        let drawX = x;
        if (currentFacingMode === 'user') {
          drawX = overlayCanvas.width - (x + w);
        }
        overlayCtx.fillRect(drawX, y, w, h);
        overlayCtx.strokeRect(drawX, y, w, h);
      }
    }

    // --- إجراء التعرف ---
    async function recognizeAndDraw(frameDataUrl) {
      if (!ocrWorker) await initOCRWorker();
      if (!ocrWorker) return null;
      try {
        const processed = await preprocessFrame(frameDataUrl);
        const { data } = await ocrWorker.recognize(processed);
        return data;
      } catch(e) { return null; }
    }

    async function processFrame() {
      if (!stream || isProcessing) return;
      const frame = captureFrame();
      if (!frame) return;
      isProcessing = true;
      const data = await recognizeAndDraw(frame);
      if (data) {
        const words = data.words;
        drawBoxes(words, video.videoWidth, video.videoHeight);
        const fullText = data.text.trim();
        if (fullText && fullText !== lastFullText) {
          lastFullText = fullText;
          resultText.textContent = fullText;
          if (!resultSheet.classList.contains('visible')) {
            resultSheet.classList.add('visible');
          }
        }
      }
      isProcessing = false;
    }

    // --- البث المباشر ---
    function startLiveMode() {
      if (!stream) return;
      liveMode = true;
      btnToggleLive.classList.add('active');
      if (liveInterval) clearInterval(liveInterval);
      liveInterval = setInterval(() => processFrame(), 1800);
      processFrame(); // فورية
    }

    function stopLiveMode() {
      liveMode = false;
      if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
      btnToggleLive.classList.remove('active');
      clearOverlay();
    }

    function toggleLiveMode() {
      if (liveMode) stopLiveMode(); else startLiveMode();
    }

    // لقطة واحدة
    async function takeSnapshot() {
      if (!stream) return;
      const frame = captureFrame();
      if (!frame) return;
      isProcessing = true;
      const data = await recognizeAndDraw(frame);
      if (data) {
        drawBoxes(data.words, video.videoWidth, video.videoHeight);
        const text = data.text.trim();
        if (text) {
          resultText.textContent = text;
          resultSheet.classList.add('visible');
        }
      }
      isProcessing = false;
    }

    // --- الإجراءات ---
    function copyText() {
      const t = resultText.textContent;
      if (!t) return;
      navigator.clipboard.writeText(t).then(() => {
        btnCopy.innerHTML = '✅ تم';
        setTimeout(() => btnCopy.innerHTML = '📋 نسخ', 2000);
      });
    }
    function searchText() {
      const t = resultText.textContent;
      if (t) window.open(`https://www.google.com/search?q=${encodeURIComponent(t)}`);
    }
    function translateText() {
      const t = resultText.textContent;
      if (t) window.open(`https://translate.google.com/?text=${encodeURIComponent(t)}`);
    }

    // --- الأحداث ---
    btnStartCamera.addEventListener('click', () => startCamera('environment'));
    btnCapture.addEventListener('click', takeSnapshot);
    btnToggleLive.addEventListener('click', toggleLiveMode);
    btnSwitchCam.addEventListener('click', switchCamera);
    btnCopy.addEventListener('click', copyText);
    btnSearch.addEventListener('click', searchText);
    btnTranslate.addEventListener('click', translateText);
    btnClose.addEventListener('click', () => resultSheet.classList.remove('visible'));

    langBtns.forEach(b => b.addEventListener('click', () => {
      langBtns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selectedLang = b.dataset.lang;
      initOCRWorker();
    }));

    // التهيئة الأولية
    initOCRWorker();
    window.addEventListener('beforeunload', ()=>{
      stopLiveMode();
      stopCamera();
      if (ocrWorker) ocrWorker.terminate();
    });

    // تعديل حجم الـ overlay عند تغيير حجم الفيديو
    video.addEventListener('loadedmetadata', resizeOverlay);
    window.addEventListener('resize', resizeOverlay);
  })();
</script>
</body>
</html>
